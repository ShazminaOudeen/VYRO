server:
  port: ${PORT:8080}
spring:
  application:
    name: gym-booking
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/vyro}
    username: ${DB_USER:vyro}
    password: ${DB_PASSWORD:vyro}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
gemini:
  api:
    key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}



